<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" defer>

    <link rel="stylesheet" href="../styles/style.css">

    <script src="../scripts/script.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
</head>

<body>
    <main>

        <section id="pokemonGrid">
            <h1>Pokédex</h1>
        </section>


        <div class="modal fade" id="modalPokemon" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="nomePokemon">Detalhes do Pokémon</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <img id="imagemPokemon" src="" alt="">

                <p>Tipo: <span id="tipoPokemon"></span></p>

             <p>HP: <span id="hpPokemon"></span></p>
             <p>Ataque: <span id="ataquePokemon"></span></p>
              <p>Defesa: <span id="defesaPokemon"></span></p>
              <p>Velocidade: <span id="velocidadePokemon"></span></p>

               <p>Altura: <span id="alturaPokemon"></span></p>
              <p>Peso: <span id="pesoPokemon"></span></p>

            </div>

        </div>
    </div>
</div>

    </main>
</body>
</html>
